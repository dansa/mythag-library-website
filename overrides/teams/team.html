<section class="mythag-team" aria-label="{{ team.name }} team" data-abbreviations>
  <header class="mythag-team__header">
    <p class="mythag-team__title">{{ team.name }}</p>
    <figure class="mythag-team__posse">
      <img src="{{ team.posse.image }}" alt="" loading="lazy">
      <figcaption>{{ team.posse.label }}</figcaption>
    </figure>
  </header>
  <ol class="mythag-team__members">
    {% for member in team.members %}
      <li class="mythag-team__member">
        <figure class="mythag-team__awakener">
          <a href="{{ member.awakener.url }}">
            <img src="{{ member.awakener.image }}" alt="" loading="lazy">
            <figcaption>{{ member.awakener.label }}</figcaption>
          </a>
        </figure>
        <ul class="mythag-team__gear" aria-label="{{ member.awakener.label }} equipment">
          <li>
            <a href="{{ member.covenant.url }}" aria-label="{{ member.covenant.label }}" title="{{ member.covenant.label }}">
              <img src="{{ member.covenant.image }}" alt="" loading="lazy">
              <span class="sr-only">{{ member.covenant.label }}</span>
            </a>
          </li>
          {% for wheel in member.wheels %}
            <li aria-label="{{ wheel.label }}" title="{{ wheel.label }}">
              <img src="{{ wheel.image }}" alt="" loading="lazy">
              <span class="sr-only">{{ wheel.label }}</span>
            </li>
          {% endfor %}
        </ul>
      </li>
    {% endfor %}
  </ol>
</section>
